[project]
name = "centinela"
version = "0.1.0"
description = "Automated bidding agent for SECOP II electronic reverse auctions"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2.0",
]

[project.scripts]
centinela = "centinela.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centinela"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Typing — strict. A type slip in the money path is a company-destroying event.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# Note: `disallow_any_explicit` is deliberately NOT set. It fires almost exclusively at
# the JSON boundary, where the platform's payloads genuinely are untyped, and it caught
# no real defect while adding noise. The hazard it was reaching for -- a float in the
# money path -- is enforced directly instead, by tests/test_money_path_purity.py.

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Floats and wall-clock time are banned in the money and timing paths.
# The bid arithmetic works in integer centavos; time comes from the server clock.
"time.time".msg = "Use the ServerClock. Local wall-clock time is not authoritative (SOT.md 4.4)."

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
